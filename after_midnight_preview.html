<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Midnight v7 Preview</title><style>
:root{--bg:#0e0b14;--panel:#1b1523;--line:#3b3048;--text:#fff8fb;--muted:#aa9cab;--pink:#f3a7c9;--pink2:#ffd2e4;--green:#9ee6ba}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#2c1834,transparent 36%),#0e0b14;color:var(--text);font-family:Inter,system-ui,sans-serif}.app{width:min(100%,470px);min-height:100vh;margin:auto;background:#100c17;position:relative;padding-bottom:86px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#100c17e8;backdrop-filter:blur(18px);border-bottom:1px solid #282031}.k{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--pink);font-weight:800}.pad{padding:22px 18px}.card{background:linear-gradient(180deg,#241c2d,#191320);border:1px solid var(--line);border-radius:20px;padding:15px}.stack{display:grid;gap:11px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}h1{font-size:32px;line-height:1.04}h2{font-size:22px}p,.muted{color:var(--muted);line-height:1.45}.btn{border:0;background:linear-gradient(135deg,var(--pink2),var(--pink));color:#25131d;font-weight:850;border-radius:14px;padding:12px 14px;cursor:pointer}.ghost{background:#211827;color:var(--pink2);border:1px solid #49384f}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,470px);display:grid;grid-template-columns:repeat(6,1fr);background:#100c17f3;border-top:1px solid var(--line);padding:9px 5px 12px}.nav button{background:none;border:0;color:#8e8292;font-size:10px;display:grid;gap:3px}.nav button b{font-size:18px}.nav .on{color:var(--pink2)}.scroll{display:flex;overflow:auto;gap:10px}.show{min-width:190px;background:linear-gradient(145deg,#40283e,#17131f);border:1px solid var(--line);border-radius:18px;padding:14px}.show:nth-child(2n){background:linear-gradient(145deg,#294052,#17131f)}.icon{font-size:30px}.mini{border:1px solid #5b4861;background:#17121d;color:#eee;border-radius:9px;padding:7px 8px;font-size:11px}.saved{background:var(--pink);color:#22131c}.episode{width:100%;display:grid;grid-template-columns:44px 1fr auto;text-align:left;color:inherit;gap:10px;align-items:center}.node{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--pink);color:#24121c;font-weight:900}.lock{opacity:.46}.progress{height:7px;border-radius:20px;background:#2c2435;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#bca8ff)}.quizopt{width:100%;text-align:left;background:#14101a;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px}.chatrow{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;color:#fff}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#34253b}.bubble{padding:10px 12px;border-radius:6px 16px 16px;background:#281d2c;border:1px solid #4b354e}.notice{padding:13px;border-left:3px solid var(--pink);background:#211725;border-radius:0 12px 12px 0;color:#d8cbd7}.good{color:var(--green);font-weight:800}.bad{color:#e7adad;font-weight:800}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.section h2{margin:0}.complete{text-align:center}.check{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:auto;background:var(--green);color:#122019;font-size:26px;font-weight:900}textarea{width:100%;min-height:180px;border-radius:14px;border:1px solid var(--line);background:#100c16;color:#fff;padding:12px}.chatbox{display:grid;gap:10px}.fakeInput{display:flex;gap:8px}.fakeInput input{flex:1;border:1px solid var(--line);background:#100c16;color:#fff;border-radius:12px;padding:11px}.badge{border:1px solid #4b3b54;border-radius:999px;padding:5px 8px;font-size:10px}.hide{display:none}@media(min-width:760px){body{padding:24px 0}.app{border-radius:26px;overflow:hidden;min-height:calc(100vh - 48px)}.nav{bottom:24px;border-radius:0 0 26px 26px}}</style></head><body><div class="app"><div id="screen"></div><nav class="nav" id="nav"></nav></div><script>
const shows=[['breaking-bad','⚗️','Breaking Bad','Crime drama'],['stranger-things','🚲','Stranger Things','Sci-fi · Mystery'],['vampire-diaries','🩸','The Vampire Diaries','Fantasy · Drama'],['friends','☕','Friends','Comedy'],['the-office','📎','The Office','Comedy'],['game-of-thrones','🐉','Game of Thrones','Fantasy'],['bridgerton','🪻','Bridgerton','Period drama'],['wednesday','🕷️','Wednesday','Mystery']];
const eps=['Pilot',"Cat's in the Bag...","...and the Bag's in the River",'Cancer Man','Gray Matter',"Crazy Handful of Nothin'",'A No-Rough-Stuff-Type Deal'];
const quiz=[['What subject does Walter White teach?',['Chemistry','Physics','Biology','Mathematics'],'Chemistry'],['Who does Walt reconnect with to begin making meth?',['Jesse Pinkman','Hank Schrader','Gus Fring','Saul Goodman'],'Jesse Pinkman'],['What major diagnosis changes Walt’s outlook?',['Lung cancer','Heart disease','Kidney failure','Leukemia'],'Lung cancer']];
let page='home', saved=['breaking-bad','stranger-things'], q=0, score=0, trivia=false, done=false, journal='';
const S=document.querySelector('#screen'),N=document.querySelector('#nav');
function top(title,sub='Girls Who Can’t Finish a Show'){return `<div class=top><div><div class=k>${sub}</div><strong>${title}</strong></div><span class=badge>4 👥</span></div>`}
function showCard(x){let sv=saved.includes(x[0]);return `<div class=show><div class=icon>${x[1]}</div><h3>${x[2]}</h3><div class=muted style="font-size:12px">TV · ${x[3]}</div><div class=row style="margin-top:10px"><button class=mini data-start="${x[0]}">Start club</button><button class="mini ${sv?'saved':''}" data-save="${x[0]}">${sv?'✓ Saved':'+ My List'}</button></div></div>`}
function home(){return top('Home')+`<div class=pad><h1>Pick up where you left off</h1><button class="card episode" data-go=map><div class=node>▶</div><div><div class=k>continue club</div><h2 style="margin:4px 0">Breaking Bad</h2><div class=muted>5 seasons · 62 numbered episodes · Season 1 in progress</div></div><span>›</span></button><div class=section><h2>My List</h2><span class=muted>${saved.length} saved</span></div><div class=scroll>${shows.filter(x=>saved.includes(x[0])).map(showCard).join('')}</div><div class=section><h2>Explore</h2><span class=muted>Watch later</span></div><div class=scroll>${shows.map(showCard).join('')}</div></div>`}
function map(){return top('Breaking Bad','Season 1 · 5 seasons · 62 episodes')+`<div class=pad><div class=card><div class="row between"><div><div class=k>live series data</div><strong>5 seasons · 62 numbered episodes</strong></div><span class=badge>TVmaze</span></div><p>Season 1 has 7 episodes. This preview shows the corrected catalog structure.</p></div><div class=stack style="margin-top:12px">${eps.map((e,i)=>`<button class="card episode ${i>0?'lock':''}" ${i===0?'data-ep=1':''}><div class=node>${i+1}</div><div><strong>Episode ${i+1}</strong><div>${i===0?e:'???'}</div><div class=muted style="font-size:11px">${i===0?'1/4 watched':'locked until group advances'}</div></div><span>›</span></button>`).join('')}</div></div>`}
function episode(){return top('Episode 1','Breaking Bad · Season 1')+`<div class=pad><div class=k>Breaking Bad · Season 1</div><h1>Pilot</h1><p>A high-school chemistry teacher receives a devastating diagnosis and reconnects with a former student.</p><button class=btn style="width:100%">✓ Marked as Watched</button><button class="btn ghost" style="width:100%;margin-top:9px" data-trivia>${done?`Replay Trivia · ${score}/3`:'Start 3-question Trivia'}</button>${trivia?quizBox():''}<div class=notice style="margin-top:12px"><strong>Spoiler lock:</strong> story-changing events wait until everyone marks the episode watched.</div></div>`}
function quizBox(){if(done)return `<div class="card complete" style="margin-top:12px"><div class=check>✓</div><div class=k style="margin-top:10px">trivia complete</div><h1>${score}/3</h1><p>You finished the round. In the real app, your result is posted to the spoiler-safe Episode 1 chat.</p></div>`;let z=quiz[q];return `<div class=card style="margin-top:12px"><div class="row between"><div class=k>episode trivia</div><span class=badge>${q+1}/3</span></div><div class=progress style="margin:10px 0 14px"><span style="width:${q/3*100}%"></span></div><h3>${z[0]}</h3><div class=stack>${z[1].map(a=>`<button class=quizopt data-answer="${a.replaceAll('"','&quot;')}">${a}</button>`).join('')}</div></div>`}
function chats(){return top('Chats','Club, characters & episode rooms')+`<div class="pad stack">${[['💬','Club Chat','Everyone + active characters'],['🧢','Jesse Pinkman','Character chat · shared with club'],['🧪','Walter White','Character chat · shared with club'],['📘','Skyler White','Character chat · shared with club'],['🛡️','Hank Schrader','Character chat · shared with club'],['🎬','Episode 1','Pilot discussion']].map((x,i)=>`<button class="card chatrow" ${i===1?'data-jesse':''}><div class=avatar>${x[0]}</div><div><strong>${x[1]}</strong><div class=muted style="font-size:11px">${x[2]}</div></div><span>›</span></button>`).join('')}</div>`}
function jesse(){return top('Jesse Pinkman','Character chat · REAL AI in full app')+`<div class=pad><div class=notice><span class=bad>Static preview: AI intentionally disabled.</span><br>This preview will not fake a reply. Run the full v7 app with <code>OPENAI_API_KEY</code> and Jesse will answer using the real OpenAI API + recent chat history.</div><div class=chatbox style="margin-top:14px"><div class=row><div class=avatar>🧢</div><div><div class=muted style="font-size:11px">Jesse Pinkman · AI status</div><div class=bubble>Waiting for the real server connection.</div></div></div></div><div class=fakeInput style="margin-top:16px"><input placeholder="How are you?" disabled><button class=btn disabled>➤</button></div></div>`}
function challenges(){return top('Challenges','Personalized to your goals')+`<div class=pad><div class=card><div class="row between"><span class=badge>🧢 Jesse</span><span class=muted>+25 XP</span></div><h2 style="margin:14px 0 5px">Get Active Challenge</h2><p>10 squats — or swap for a 2-minute stretch.</p><button class=btn style="width:100%">Complete Challenge</button></div></div>`}
function journalPage(){return top('Private Journal','Only you can see this')+`<div class=pad><div class=card><div class=k>Breaking Bad · season 1</div><h2>My Journey</h2><textarea id=j>${journal}</textarea><button class="btn ghost" style="width:100%;margin-top:9px" data-jsave>Save private entry</button></div></div>`}
function profile(){return top('Profile')+`<div class=pad><div class=card style="text-align:center"><div class=avatar style="margin:auto;width:70px;height:70px;font-size:28px">✨</div><h2>Mia</h2><p>Jesse trust: Familiar ♥♡♡♡</p></div></div>`}
function nav(){N.innerHTML=[['home','🏠','Home'],['map','🗺️','Map'],['chat','💬','Chat'],['challenges','⚡','Challenges'],['journal','📓','Journal'],['profile','👤','Profile']].map(x=>`<button class="${page===x[0]?'on':''}" data-go="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('')}
function render(){let f={home,map,episode,chats,jesse,challenges,journal:journalPage,profile}[page]||home;S.innerHTML=f();nav();bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go==='chat'?'chats':b.dataset.go;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let id=b.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];render()});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{page=b.dataset.start==='breaking-bad'?'map':'home';render()});document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{page='episode';render()});document.querySelectorAll('[data-jesse]').forEach(b=>b.onclick=()=>{page='jesse';render()});document.querySelectorAll('[data-trivia]').forEach(b=>b.onclick=()=>{trivia=true;q=0;score=0;done=false;render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(b.dataset.answer===quiz[q][2])score++;q++;if(q>=3)done=true;render()});document.querySelectorAll('[data-jsave]').forEach(b=>b.onclick=()=>{journal=document.querySelector('#j').value;b.textContent='✓ Saved'})}
render();</script></body></html>
